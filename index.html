<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLACK//TERMINAL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background effects -->
    <div class="scanlines"></div>
    <div class="noise"></div>

    <!-- Boot screen -->
    <div id="bootScreen">
        <div id="bootText"></div>
    </div>

    <!-- Main terminal -->
    <main id="terminalApp" class="hidden">

        <header class="topbar">

            <div class="logo">
                BLACK<span>//</span>TERMINAL
            </div>

            <div class="status">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>

        </header>


        <section class="terminal-wrapper">

            <div class="terminal-header">

                <div>
                    <span class="red-dot"></span>
                    <span class="yellow-dot"></span>
                    <span class="green-dot"></span>
                </div>

                <div class="terminal-title">
                    secure_shell://node-07
                </div>

            </div>


            <div id="terminalOutput" class="terminal-output">

                <div class="line">
                    BLACK TERMINAL v4.17
                </div>

                <div class="line dim">
                    Fictional underground interface
                </div>

                <br>

                <div class="line">
                    Type <span class="green">help</span> to display available commands.
                </div>

            </div>


            <div class="input-line">

                <span class="prompt">
                    root@black-node:~$
                </span>

                <input
                    type="text"
                    id="commandInput"
                    autocomplete="off"
                    spellcheck="false"
                    autofocus
                >

            </div>

        </section>


        <footer>
            BLACK TERMINAL // FICTIONAL EXPERIENCE
        </footer>

    </main>


    <script src="script.js"></script>

</body>
          </html>
